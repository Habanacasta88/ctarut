server {
    listen 80 default_server;
    server_name labradores.org www.labradores.org _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirecciones relativas: evita que nginx degrade a http:// el Location
    # del redirect de barra final cuando está detrás de Cloudflare (puerto 80).
    # Sin esto, /blog -> http://.../blog/ -> 307 https -> 200 (cadena triple).
    absolute_redirect off;

    # www → non-www (301)
    if ($host = www.labradores.org) {
        return 301 https://labradores.org$request_uri;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css text/xml text/plain application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1000;

    # ─── 301 Redirects: URLs antiguas WP → estructura Astro ───────────────────
    # Preservar autoridad SEO de URLs indexadas en Google
    # El negative-lookahead protege la paginación nueva (/blog/2/, /blog/15/),
    # que NO debe redirigir a /2/. Solo redirige slugs antiguos (/blog/mi-articulo).
    rewrite ^/blog/(?![0-9]+/?$)(.+)$  /$1 permanent;
    rewrite ^/cuidados/(.+)$      /$1 permanent;
    rewrite ^/alimentacion/(.+)$  /$1 permanent;
    rewrite ^/entrenamiento/(.+)$ /$1 permanent;
    rewrite ^/cachorros/(.+)$     /$1 permanent;
    rewrite ^/resenas/(.+)$       /$1 permanent;
    # ──────────────────────────────────────────────────────────────────────────

    # Cache estático (1 año)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots.txt y llms.txt
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /llms.txt {
        expires 1d;
        add_header Cache-Control "public";
        default_type text/plain;
    }

    # Sitemap
    location ~* sitemap.*\.xml$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Páginas
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 404
    error_page 404 /404.html;
    location = /404.html { internal; }
}
